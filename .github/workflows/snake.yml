name: Generate snake

on:
  # 每天跑一次，贡献图变了就跟着更新
  schedule:
    - cron: "0 18 * * *"
  # 允许手动触发
  workflow_dispatch:
  # profile 仓库每次推送时也重跑
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake from the contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # snk 会在格子下面再画一条横向的分段条形图（class="u"）。它在页面上读起来
      # 像一根没填满的进度条，还占着 192 的高度。这里删掉它，并把 viewBox 和
      # height 一起收掉下面那段空白。
      #
      # 结果写到 out/ 而不是原地改：snk 在容器里跑，dist/ 属于 root，sed -i 和
      # 重定向都写不进去（"couldn't open temporary file ... Permission denied"）。
      - name: Drop the contribution bar and the empty space under it
        run: |
          mkdir -p out
          for f in dist/*.svg; do
            sed -E \
              -e 's|<rect class="u [^>]*/>||g' \
              -e 's|viewBox="-16 -32 880 192"|viewBox="-16 -32 880 164"|' \
              -e 's|width="880" height="192"|width="880" height="164"|' \
              "$f" > "out/$(basename "$f")"
            echo "$(basename "$f"): $(wc -c < "out/$(basename "$f")") bytes, bar rects left: $(grep -c 'class="u ' "out/$(basename "$f")" || true)"
          done

      - name: Push the generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
