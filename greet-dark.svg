<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 420 46'
    style='background-color: #00000000;'
    width='420px' height='46px'>

    <style>
@font-face {
  font-family: 'Noto Sans SC';
  font-style: normal;
  font-weight: 500;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='4000ms' fill='remove'
                    values='m0,23 h0 ; m0,23 h420 ; m0,23 h420 ; m0,23 h0' keyTimes='0;0.52;0.87;1' />
                    </path>
    <text font-family='"Noto Sans SC", monospace' fill='#C9D1D9' font-size='21'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            做的东西基本是给自己用的
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4000ms' fill='remove'
                    values='m0,23 h0 ; m0,23 h420 ; m0,23 h420 ; m0,23 h0' keyTimes='0;0.52;0.87;1' />
                    </path>
    <text font-family='"Noto Sans SC", monospace' fill='#C9D1D9' font-size='21'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            装上能放着不管，才算做完
        </textPath>
    </text>
</svg>
